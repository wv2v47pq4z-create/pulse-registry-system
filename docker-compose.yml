version: '3.8'

services:
  autopost:
    build: .
    container_name: sr-os-autopost-engine
    ports:
      - "8181:8181"
    volumes:
      - ./logs:/app/logs
      - ./posted:/app/posted
    environment:
      - NODE_ENV=production
      - PORT=8181
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8181/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
