name: "Copilot Setup Steps"

# This workflow pre-installs the project's dependencies into Copilot coding
# agent's ephemeral environment so the agent can build, test, and validate
# changes without spending time on environment setup.

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Solidity compiler (solc)
        run: |
          npm install -g solc@0.8.28

      - name: Install solhint (Solidity linter)
        run: |
          npm install -g solhint

      - name: Install Hardhat (if package.json present)
        run: |
          if [ -f package.json ]; then
            npm install
          fi
