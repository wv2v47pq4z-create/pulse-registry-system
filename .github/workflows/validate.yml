name: Validate SR-OS AutoPost

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Python Code
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Display Python version
      run: python --version
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify file structure
      shell: bash
      run: |
        echo "Checking required files..."
        test -f autopost_client.py || (echo "ERROR: autopost_client.py not found" && exit 1)
        test -f config.example.json || (echo "ERROR: config.example.json not found" && exit 1)
        test -f requirements.txt || (echo "ERROR: requirements.txt not found" && exit 1)
        test -f README.md || (echo "ERROR: README.md not found" && exit 1)
        test -f MASTER_PROMPT.md || (echo "ERROR: MASTER_PROMPT.md not found" && exit 1)
        echo "✓ All required files present"
    
    - name: Check Python syntax
      run: python -m py_compile autopost_client.py
    
    - name: Test module import
      run: python -c "import autopost_client; print('✓ Module imported successfully')"
    
    - name: Run import tests
      run: python tests/test_import.py
    
    - name: Validate configuration example
      run: python -c "import json; json.load(open('config.example.json')); print('✓ config.example.json is valid')"
    
    - name: Test heartbeat script
      run: python scripts/heartbeat.py --json
    
    - name: Summary
      if: success()
      run: echo "✓ All validation checks passed on ${{ matrix.os }} with Python ${{ matrix.python-version }}"
