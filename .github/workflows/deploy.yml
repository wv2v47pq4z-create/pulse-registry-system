# .github/workflows/deploy.yml
name: Deploy SR-HYBRID (Blue/Green K8s)

on:
  push:
    branches: [ main ]
    tags:
      - "v*"

env:
  APP_NAME: sr-hybrid
  K8S_NAMESPACE: sr-hybrid
  DOCKER_IMAGE: ${{ secrets.DOCKER_REGISTRY }}/sr-hybrid
  HEALTH_PATH: /health
  HEALTH_PORT: "8080"

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set primary image tag output
        id: image
        run: |
          # Use the SHA tag as primary
          IMAGE_TAG="${DOCKER_IMAGE}:${GITHUB_SHA}"
          echo "image=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
        env:
          DOCKER_IMAGE: ${{ env.DOCKER_IMAGE }}
    outputs:
      image: ${{ steps.image.outputs.image }}

  deploy-blue-green:
    name: Blue/Green Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}
      APP_NAME: ${{ env.APP_NAME }}
      K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
      HEALTH_PATH: ${{ env.HEALTH_PATH }}
      HEALTH_PORT: ${{ env.HEALTH_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${KUBE_CONFIG_B64}" | base64 -d > ~/.kube/config
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}

      - name: Get active color (blue/green)
        id: color
        run: |
          set -e
          CURRENT_COLOR=$(kubectl get svc "${APP_NAME}" -n "${K8S_NAMESPACE}" -o jsonpath='{.spec.selector.version}' 2>/dev/null || echo "blue")
          if [ -z "$CURRENT_COLOR" ]; then
            CURRENT_COLOR="blue"
          fi

          if [ "$CURRENT_COLOR" = "blue" ]; then
            NEW_COLOR="green"
          else
            NEW_COLOR="blue"
          fi

          echo "Current color: $CURRENT_COLOR"
          echo "New color: $NEW_COLOR"

          echo "current=${CURRENT_COLOR}" >> "$GITHUB_OUTPUT"
          echo "next=${NEW_COLOR}" >> "$GITHUB_OUTPUT"
        env:
          APP_NAME: ${{ env.APP_NAME }}
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}

      - name: Apply manifests (ensure both blue & green exist)
        run: |
          # Assumes k8s/ has:
          # - sr-hybrid-service.yaml (selector app=sr-hybrid, version=<blue|green>)
          # - sr-hybrid-blue-deployment.yaml (labels: app=sr-hybrid, version=blue)
          # - sr-hybrid-green-deployment.yaml (labels: app=sr-hybrid, version=green)
          kubectl apply -n "${K8S_NAMESPACE}" -f k8s/namespace.yaml || true
          kubectl apply -n "${K8S_NAMESPACE}" -f k8s/storage-pvc.yaml
          kubectl apply -n "${K8S_NAMESPACE}" -f k8s/sr-hybrid-service.yaml
          kubectl apply -n "${K8S_NAMESPACE}" -f k8s/prometheus-configmap.yaml
          kubectl apply -n "${K8S_NAMESPACE}" -f k8s/prometheus-deployment.yaml
          kubectl apply -n "${K8S_NAMESPACE}" -f k8s/prometheus-service.yaml
          kubectl apply -n "${K8S_NAMESPACE}" -f k8s/grafana-deployment.yaml
          kubectl apply -n "${K8S_NAMESPACE}" -f k8s/grafana-service.yaml

      - name: Update next-color deployment image
        id: update-deployment
        run: |
          set -e
          NEXT_COLOR="${{ steps.color.outputs.next }}"
          DEPLOYMENT_NAME="${APP_NAME}-${NEXT_COLOR}"

          echo "Updating deployment: ${DEPLOYMENT_NAME} with image: ${IMAGE}"

          # Set image on the next (inactive) color deployment
          kubectl set image deployment/${DEPLOYMENT_NAME} ${APP_NAME}=${IMAGE} -n "${K8S_NAMESPACE}"

          # Wait for rollout
          kubectl rollout status deployment/${DEPLOYMENT_NAME} -n "${K8S_NAMESPACE}" --timeout=300s
        env:
          APP_NAME: ${{ env.APP_NAME }}
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
          IMAGE: ${{ env.IMAGE }}

      - name: Health check with exponential backoff (next color)
        id: healthcheck
        run: |
          set -e
          NEXT_COLOR="${{ steps.color.outputs.next }}"
          LABEL_SELECTOR="app=${APP_NAME},version=${NEXT_COLOR}"

          echo "Finding pod for label: ${LABEL_SELECTOR}"
          POD_NAME=$(kubectl get pods -n "${K8S_NAMESPACE}" -l "${LABEL_SELECTOR}" -o jsonpath='{.items[0].metadata.name}')
          echo "Using pod: ${POD_NAME}"

          SUCCESS=0
          MAX_ATTEMPTS=5

          for i in $(seq 1 ${MAX_ATTEMPTS}); do
            echo "Health check attempt ${i}/${MAX_ATTEMPTS}..."

            set +e
            kubectl exec -n "${K8S_NAMESPACE}" "${POD_NAME}" -- \
              curl -sSf "http://localhost:${HEALTH_PORT}${HEALTH_PATH}" >/tmp/health_body 2>/tmp/health_err
            STATUS=$?
            set -e

            if [ "$STATUS" -eq 0 ]; then
              echo "Health check passed."
              SUCCESS=1
              break
            else
              echo "Health check failed (attempt ${i}). Retrying with backoff..."
              cat /tmp/health_err || true
              sleep $((i * 10))
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Health check failed after ${MAX_ATTEMPTS} attempts."
            echo "status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"
        env:
          APP_NAME: ${{ env.APP_NAME }}
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
          HEALTH_PATH: ${{ env.HEALTH_PATH }}
          HEALTH_PORT: ${{ env.HEALTH_PORT }}

      - name: Switch service to next color (blue/green cutover)
        if: steps.healthcheck.outputs.status == 'success'
        id: cutover
        run: |
          set -e
          NEXT_COLOR="${{ steps.color.outputs.next }}"

          echo "Switching Service selector to version=${NEXT_COLOR}"

          kubectl patch svc "${APP_NAME}" -n "${K8S_NAMESPACE}" \
            -p "{\"spec\":{\"selector\":{\"app\":\"${APP_NAME}\",\"version\":\"${NEXT_COLOR}\"}}}"

          echo "Cutover completed to color: ${NEXT_COLOR}"
          echo "new_color=${NEXT_COLOR}" >> "$GITHUB_OUTPUT"
        env:
          APP_NAME: ${{ env.APP_NAME }}
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}

      - name: Rollback next color deployment if health failed
        if: failure() && steps.healthcheck.outcome == 'failure'
        run: |
          set -e
          NEXT_COLOR="${{ steps.color.outputs.next }}"
          DEPLOYMENT_NAME="${APP_NAME}-${NEXT_COLOR}"

          echo "Rolling back deployment ${DEPLOYMENT_NAME} due to failed health check."
          kubectl rollout undo deployment/${DEPLOYMENT_NAME} -n "${K8S_NAMESPACE}"
        env:
          APP_NAME: ${{ env.APP_NAME }}
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}

      - name: Capture deployment state & logs
        if: always()
        run: |
          mkdir -p deploy-logs

          echo "=== Deploy Summary ===" > deploy-logs/summary.txt
          echo "Image: ${IMAGE}" >> deploy-logs/summary.txt
          echo "Current color before: ${{ steps.color.outputs.current }}" >> deploy-logs/summary.txt
          echo "Next color attempted: ${{ steps.color.outputs.next }}" >> deploy-logs/summary.txt
          echo "Cutover status: ${{ steps.healthcheck.outputs.status }}" >> deploy-logs/summary.txt
          echo "GitHub SHA: ${GITHUB_SHA}" >> deploy-logs/summary.txt
          echo "Run ID: ${GITHUB_RUN_ID}" >> deploy-logs/summary.txt

          kubectl get pods -n "${K8S_NAMESPACE}" -o wide > deploy-logs/pods.txt
          kubectl get deploy -n "${K8S_NAMESPACE}" -o wide > deploy-logs/deployments.txt
          kubectl get svc -n "${K8S_NAMESPACE}" -o wide > deploy-logs/services.txt

          # Logs for both colors (if present)
          for COLOR in blue green; do
            DEPLOY="${APP_NAME}-${COLOR}"
            kubectl get deploy/${DEPLOY} -n "${K8S_NAMESPACE}" >/dev/null 2>&1 || continue
            echo "Collecting logs for ${DEPLOY}..."
            POD=$(kubectl get pods -n "${K8S_NAMESPACE}" -l app="${APP_NAME}",version="${COLOR}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || echo "")
            if [ -n "$POD" ]; then
              kubectl logs -n "${K8S_NAMESPACE}" "$POD" > "deploy-logs/${DEPLOY}.log" 2>&1 || true
            fi
          done
        env:
          APP_NAME: ${{ env.APP_NAME }}
          K8S_NAMESPACE: ${{ env.K8S_NAMESPACE }}
          IMAGE: ${{ env.IMAGE }}

      - name: Upload deploy logs (short retention for staging analysis)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs-${{ github.run_id }}
          path: deploy-logs
          retention-days: 14

      - name: Send Slack notification (optional)
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          STATUS="unknown"
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="success"
          else
            STATUS="failure"
          fi

          NEW_COLOR="${{ steps.cutover.outputs.new_color || steps.color.outputs.current }}"
          HEALTH_STATUS="${{ steps.healthcheck.outputs.status || 'not-run' }}"

          payload=$(cat <<EOF
          {
            "text": "SR-HYBRID Deploy: ${STATUS}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*SR-HYBRID Deploy (${STATUS})*"
                }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*Image:* ${IMAGE}" },
                  { "type": "mrkdwn", "text": "*Namespace:* ${K8S_NAMESPACE}" },
                  { "type": "mrkdwn", "text": "*Color:* ${NEW_COLOR}" },
                  { "type": "mrkdwn", "text": "*Health:* ${HEALTH_STATUS}" },
                  { "type": "mrkdwn", "text": "*Run ID:* ${GITHUB_RUN_ID}" },
                  { "type": "mrkdwn", "text": "*Commit:* ${GITHUB_SHA}" }
                ]
              }
            ]
          }
          EOF
          )

          curl -X POST -H 'Content-type: application/json' --data "${payload}" "${SLACK_WEBHOOK_URL}"
