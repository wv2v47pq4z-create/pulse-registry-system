name: Heartbeat Monitor

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    name: Run Heartbeat Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run heartbeat monitor
      run: python scripts/heartbeat.py --json
    
    - name: Check status
      if: success()
      run: echo "✓ Heartbeat check passed"
    
    - name: Notify on failure
      if: failure()
      run: echo "✗ Heartbeat check failed - review logs"
