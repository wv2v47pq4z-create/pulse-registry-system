apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sr-hybrid
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'sr-hybrid'
        static_configs:
          - targets: ['sr-hybrid:8080']
        metrics_path: '/metrics'
