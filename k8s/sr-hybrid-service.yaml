apiVersion: v1
kind: Service
metadata:
  name: sr-hybrid
  namespace: sr-hybrid
  labels:
    app: sr-hybrid
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: sr-hybrid
    version: blue  # This selector will be dynamically updated by the deployment workflow
