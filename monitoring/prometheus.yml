global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'sr-hybrid'
    environment: 'production'

scrape_configs:
  - job_name: 'sr-hybrid'
    static_configs:
      - targets: ['sr-hybrid:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
